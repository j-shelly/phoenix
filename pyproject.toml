[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-sleeve"
version = "0.1.0"
description = "A two-sleeve learning-first crypto trading system: a conservative delta-neutral carry sleeve and a small high-risk momentum sleeve."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
live = [
    "hyperliquid-python-sdk>=0.9",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
two-sleeve = "two_sleeve.cli:main"

[tool.setuptools.packages.find]
include = ["two_sleeve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
